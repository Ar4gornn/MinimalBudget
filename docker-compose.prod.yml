# Production stack (Story 7.5). Host-agnostic: any machine with Docker and a domain
# pointed at it. No provider SDK, nothing cloud-specific.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the reverse proxy publishes ports. The database and the API are reachable on the
# internal network and from nowhere else, so an exposed Postgres or an unencrypted API
# port is not something you can leave switched on by accident.

name: minimalbudget

# Docker's default json-file driver never rotates. On a small VPS disk, months of proxy
# access logs will fill it and take Postgres down with it — a disk-full database is a much
# worse outage than a missing log. Capped and rotated for every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_OWNER: ${DB_OWNER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      # Postgres 18 stores data in a major-version subdirectory and refuses to start if
      # the volume is mounted at .../data instead of the parent.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrations run as their own step with the owner credentials, then exit. The API image
  # never carries owner credentials, so a compromised API cannot alter the schema (AD-2).
  migrate:
    build: ./backend
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${DB_OWNER}:${DB_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}
      # Present only because settings are constructed at import; the runtime role is what
      # it points at, and this container performs no request work.
      DATABASE_URL: postgresql+psycopg://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # Hardcoded, NOT ${REGISTRATION_MODE:-invite}. Compose reads the repository .env for
      # substitution, so a developer's local REGISTRATION_MODE=open silently became the
      # production setting — an internet-facing instance strangers could sign up to. This
      # was caught by testing the production stack rather than reading it. Opening
      # registration in production is now a deliberate edit to this file.
      REGISTRATION_MODE: "invite"
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      # Empty unless set: push is off on an instance that was never given keys, and the
      # API only ever reads the public one — notify.py, run from cron on the host, is what
      # holds the private key and does the sending (AD-34).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Same origin in production, so the browser never makes a cross-origin request and
      # there is no allowlist to get wrong.
      CORS_ORIGINS: ""
    # Deliberately no `ports:`. Reachable only from the proxy, on the internal network.
    expose:
      - "8000"
    # python:slim carries no curl, so the check is a urllib one-liner rather than an extra
    # package in the image.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ops/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        # Wait for healthy, not merely started: otherwise after a reboot the proxy comes up
        # first and serves 502s, which is the first thing anyone would see.
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and ACME account keys. Losing this volume means re-issuing on every
      # restart, which will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
